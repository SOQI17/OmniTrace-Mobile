name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Bajar tu código
      - uses: actions/checkout@v4

      # 2. Instalar Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Instalar dependencias (EL TRUCO: Forzamos la instalación del QR aquí)
      - name: Install Deps
        run: |
          npm install
          npm install html5-qrcode
          

      # 4. Construir la Web
      - name: Build Web
        run: npm run build

      # 5. Sincronizar
      - name: Setup Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap sync

      # 6. Preparar Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 7. Fabricar la APK
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 8. Subir el archivo
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: omnitrace-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
